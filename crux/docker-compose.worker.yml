# Crux worker (UE) — sekrety wyłącznie z env / secrets store.
services:
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL_WORKER: ${DATABASE_URL_WORKER}
      # Kopia nocna: rola crux_backup (tylko odczyt, BYPASSRLS), sesja bezpośrednia 5432.
      DATABASE_URL_BACKUP: ${DATABASE_URL_BACKUP}
      KMS_PROVIDER: ${KMS_PROVIDER:-local}
      KMS_KEY_ID: ${KMS_KEY_ID:-local-v1}
      KMS_LOCAL_DEK: ${KMS_LOCAL_DEK}
      KMS_LOCAL_PEPPER: ${KMS_LOCAL_PEPPER}
      BACKUP_LOCAL_DIR: /data/backups
      WORKER_HEALTH_PORT: "8081"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      FAKE_INTEGRATIONS: ${FAKE_INTEGRATIONS:-1}
    ports:
      - "${WORKER_HEALTH_PORT:-8081}:8081"
    volumes:
      - worker-backups:/data/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  worker-backups:
